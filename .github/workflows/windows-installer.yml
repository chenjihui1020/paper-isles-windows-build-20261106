name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build and self-check
        shell: pwsh
        run: ./windows/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PaperIsles-Windows-x64
          path: release/windows/*-Setup.exe
          if-no-files-found: error
